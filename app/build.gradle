plugins {
    id 'com.android.application'
}

android {
    namespace 'com.scamhonemtdo.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.scamhonemtdo.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
